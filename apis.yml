x-coverage:
  state: blocked
  reason: bot-challenge
  detail: >-
    The Akamai edge fronting www.dfas.mil (www.dfas.mil.edgekey.net) returns an HTTP 403 "Access
    Denied" HTML page to every automated client on every path - including / and /robots.txt - under
    a plain, a desktop Chrome and a Googlebot User-Agent, so the agency's own website could not be
    read this pass; the identical denial hits www.defense.gov, www.dla.mil and www.dcaa.mil from
    this egress, confirming a DoD-wide edge policy rather than anything DFAS chose. The hosts we
    could reach - mypay.dfas.mil (200) and corpweb1.dfas.mil (200) - served clean 404s on all nine
    well-known paths and on /openapi.json, /swagger.json and /llms.txt, and no DFAS developer
    program, API reference or machine-readable contract surfaced in registry or web search.
  evidence:
    - url: https://www.dfas.mil/
      status: 403
    - url: https://www.dfas.mil/robots.txt
      status: 403
    - url: https://www.dfas.mil/.well-known/api-catalog
      status: 403
    - url: https://mypay.dfas.mil/
      status: 200
    - url: https://mypay.dfas.mil/openapi.json
      status: 404
    - url: https://mypay.dfas.mil/.well-known/agent-card.json
      status: 404
    - url: https://corpweb1.dfas.mil/
      status: 200
    - url: https://corpweb1.dfas.mil/.well-known/security.txt
      status: 404
  checked: '2026-09-07'
